<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SmartCar</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0f;color:#e0e0e0;overflow-x:hidden;min-height:100vh;user-select:none}
        .app{max-width:480px;margin:0 auto;padding:12px}
        .header{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px}
        .header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .status-dot{width:12px;height:12px;border-radius:50%;background:#ff3b3b;transition:background .3s}
        .status-dot.connected{background:#00e676;box-shadow:0 0 8px #00e676}
        .cam-container{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#111;border:2px solid #1a1a2e}
        .cam-container img{width:100%;height:100%;object-fit:cover}
        .cam-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);font-size:.9rem;color:#888;letter-spacing:2px;transition:opacity .3s}
        .cam-overlay.hidden{opacity:0;pointer-events:none}
        .status-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin:8px 0;background:#111119;border-radius:8px;font-size:.8rem;font-weight:600;letter-spacing:1px}
        #modeLabel{color:#00d4ff}
        #detectionLabel{color:#ffc107}
        .mode-selector{display:flex;gap:6px;margin-bottom:12px}
        .mode-btn{flex:1;padding:10px 4px;border:2px solid #1a1a2e;border-radius:8px;background:#111119;color:#888;font-size:.72rem;font-weight:600;text-transform:uppercase;cursor:pointer;transition:all .2s}
        .mode-btn.active{border-color:#7b2ff7;color:#fff;background:linear-gradient(135deg,#1a1a2e,#2d1b69);box-shadow:0 0 12px rgba(123,47,247,.3)}
        .mode-btn:active{transform:scale(.95)}
        .controls{display:flex;justify-content:center;margin:16px 0}
        .dpad{display:grid;grid-template-areas:". up ." "left center right" ". down .";grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);gap:6px}
        .dpad-btn{border:2px solid #1a1a2e;border-radius:12px;background:#111119;color:#e0e0e0;font-size:1.4rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
        .dpad-btn:active,.dpad-btn.pressed{background:#7b2ff7;border-color:#9b5ff7;transform:scale(.93)}
        .dpad-btn.up{grid-area:up}.dpad-btn.down{grid-area:down}.dpad-btn.left{grid-area:left}.dpad-btn.right{grid-area:right}
        .dpad-btn.center{grid-area:center;background:#1c0a0a;border-color:#ff3b3b33;color:#ff3b3b;font-size:1rem}
        .dpad-btn.center:active{background:#ff3b3b;color:#fff}
        .slider-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#111119;border-radius:8px;margin-bottom:10px}
        .slider-row label{font-size:.8rem;font-weight:600;color:#888;min-width:44px}
        .slider-row input[type=range]{flex:1;accent-color:#7b2ff7;height:6px}
        #speedVal{font-size:.85rem;font-weight:700;color:#00d4ff;min-width:36px;text-align:right}
        .toggle-row{display:flex;gap:8px}
        .toggle-btn{flex:1;padding:12px 4px;border:2px solid #1a1a2e;border-radius:8px;background:#111119;color:#888;font-size:.72rem;font-weight:600;text-transform:uppercase;cursor:pointer;transition:all .2s}
        .toggle-btn.on{border-color:#fff;color:#fff;background:#1a1a2e;box-shadow:0 0 12px rgba(255,255,255,.3)}
        .toggle-btn.honk{background:#1a1200;border-color:#ffc10733;color:#ffc107}
        .toggle-btn.honk:active{background:#ffc107;color:#000;transform:scale(.95)}
        .controls.disabled .dpad-btn{opacity:.3;pointer-events:none}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .status-bar.parking #modeLabel{animation:pulse 1s infinite;color:#ffc107}
        .status-bar.parked #modeLabel{color:#00e676}
        .debug{padding:8px 12px;margin-top:10px;background:#111119;border-radius:8px;font-size:.7rem;color:#666;font-family:monospace}
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>SmartCar</h1>
            <div class="status-dot" id="connStatus"></div>
        </div>

        <div class="cam-container">
            <img id="camFeed" src="/video_feed" alt="Live Feed">
            <div class="cam-overlay" id="camOverlay">CONNECTING...</div>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="modeLabel">MANUAL</span>
            <span id="detectionLabel"></span>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="manual">Manual</button>
            <button class="mode-btn" data-mode="line_follow">Line</button>
            <button class="mode-btn" data-mode="traffic">Traffic</button>
            <button class="mode-btn" data-mode="autopilot">Auto</button>
            <button class="mode-btn" data-mode="smart_park">Park</button>
            <button class="mode-btn" data-mode="convoy">Follow</button>
        </div>

        <div class="controls" id="manualControls">
            <div class="dpad">
                <button class="dpad-btn up" data-action="forward">&#9650;</button>
                <button class="dpad-btn left" data-action="left">&#9664;</button>
                <button class="dpad-btn center" data-action="stop">&#9632;</button>
                <button class="dpad-btn right" data-action="right">&#9654;</button>
                <button class="dpad-btn down" data-action="backward">&#9660;</button>
            </div>
        </div>

        <div class="slider-row">
            <label>Speed</label>
            <input type="range" id="speedSlider" min="0" max="100" value="60">
            <span id="speedVal">60%</span>
        </div>

        <div class="toggle-row">
            <button class="toggle-btn on" id="ledToggle">LED Light</button>
            <button class="toggle-btn honk" id="honkBtn">Honk</button>
        </div>

        <div class="debug" id="debugLog">Ready</div>
    </div>

    <script src="/static/socket.io.min.js"></script>
    <script>
        // ── Debug logger ──
        const debugEl = document.getElementById("debugLog");
        function log(msg) {
            console.log(msg);
            debugEl.textContent = msg;
        }

        // ── Socket connection ──
        log("Connecting to server...");
        const socket = io.connect(window.location.origin, {
            transports: ["polling", "websocket"],
            reconnection: true,
            reconnectionDelay: 1000
        });

        const connStatus = document.getElementById("connStatus");
        const camOverlay = document.getElementById("camOverlay");
        const camFeed = document.getElementById("camFeed");
        const modeLabel = document.getElementById("modeLabel");
        const detectionLabel = document.getElementById("detectionLabel");
        const statusBar = document.getElementById("statusBar");
        const manualControls = document.getElementById("manualControls");
        const speedSlider = document.getElementById("speedSlider");
        const speedVal = document.getElementById("speedVal");

        let currentMode = "manual";

        socket.on("connect", function() {
            log("Connected!");
            connStatus.classList.add("connected");
            camOverlay.classList.add("hidden");
        });

        socket.on("disconnect", function() {
            log("Disconnected");
            connStatus.classList.remove("connected");
            camOverlay.classList.remove("hidden");
            camOverlay.textContent = "DISCONNECTED";
        });

        socket.on("connect_error", function(err) {
            log("Connection error: " + err.message);
        });

        // ── Camera recovery ──
        camFeed.onerror = function() {
            setTimeout(function() {
                camFeed.src = "/video_feed?" + Date.now();
            }, 2000);
        };

        // ── Status ──
        socket.on("status", function(data) {
            if (data.mode) {
                currentMode = data.mode;
                modeLabel.textContent = data.mode.replace("_", " ").toUpperCase();
                updateControlState();
            }
            if (data.speed !== undefined) {
                speedSlider.value = data.speed;
                speedVal.textContent = data.speed + "%";
            }
            statusBar.className = "status-bar";
            var det = "";
            if (data.traffic_color && data.traffic_color !== "none") {
                det = data.traffic_color.toUpperCase();
                if (data.confidence) det += " (" + Math.round(data.confidence * 100) + "%)";
            }
            if (data.line_detected !== undefined) {
                det += det ? " | " : "";
                det += data.line_detected ? "LINE OK" : "NO LINE";
            }
            if (data.park_phase) {
                det = data.park_phase.toUpperCase();
                if (data.park_phase === "parked") statusBar.classList.add("parked");
                else if (data.park_phase !== "failed") statusBar.classList.add("parking");
            }
            detectionLabel.textContent = det;
        });

        function updateControlState() {
            if (currentMode === "manual") {
                manualControls.classList.remove("disabled");
            } else {
                manualControls.classList.add("disabled");
            }
        }

        // ── Send motor command ──
        function sendControl(action) {
            log("Sending: " + action);
            socket.emit("control", {action: action});
            // Also send via HTTP as backup
            fetch("/test_motor/" + action).catch(function(){});
        }

        // ── D-Pad buttons ──
        var dpadBtns = document.querySelectorAll(".dpad-btn");
        for (var i = 0; i < dpadBtns.length; i++) {
            (function(btn) {
                var action = btn.getAttribute("data-action");

                btn.addEventListener("touchstart", function(e) {
                    e.preventDefault();
                    btn.classList.add("pressed");
                    sendControl(action);
                }, {passive: false});

                btn.addEventListener("touchend", function(e) {
                    e.preventDefault();
                    btn.classList.remove("pressed");
                    if (action !== "stop") sendControl("stop");
                }, {passive: false});

                btn.addEventListener("mousedown", function(e) {
                    e.preventDefault();
                    btn.classList.add("pressed");
                    sendControl(action);
                });

                btn.addEventListener("mouseup", function(e) {
                    e.preventDefault();
                    btn.classList.remove("pressed");
                    if (action !== "stop") sendControl("stop");
                });

                btn.addEventListener("mouseleave", function() {
                    btn.classList.remove("pressed");
                });
            })(dpadBtns[i]);
        }

        // ── Mode buttons ──
        var modeBtns = document.querySelectorAll(".mode-btn");
        for (var i = 0; i < modeBtns.length; i++) {
            (function(btn) {
                btn.addEventListener("click", function() {
                    for (var j = 0; j < modeBtns.length; j++) modeBtns[j].classList.remove("active");
                    btn.classList.add("active");
                    var mode = btn.getAttribute("data-mode");
                    log("Mode: " + mode);
                    socket.emit("set_mode", {mode: mode});
                });
            })(modeBtns[i]);
        }

        // ── Speed slider ──
        speedSlider.addEventListener("input", function() {
            speedVal.textContent = speedSlider.value + "%";
            socket.emit("set_speed", {speed: parseInt(speedSlider.value)});
        });

        // ── LED toggle ──
        var ledBtn = document.getElementById("ledToggle");
        ledBtn.addEventListener("click", function() {
            ledBtn.classList.toggle("on");
            var state = ledBtn.classList.contains("on");
            log("LED: " + (state ? "ON" : "OFF"));
            socket.emit("led", {state: state});
        });

        // ── Honk ──
        document.getElementById("honkBtn").addEventListener("click", function() {
            log("HONK!");
            socket.emit("buzzer", {times: 1});
        });
        document.getElementById("honkBtn").addEventListener("touchstart", function(e) {
            e.preventDefault();
            log("HONK!");
            socket.emit("buzzer", {times: 1});
        }, {passive: false});

        // ── Keyboard ──
        var keyMap = {
            ArrowUp:"forward", w:"forward", W:"forward",
            ArrowDown:"backward", s:"backward", S:"backward",
            ArrowLeft:"left", a:"left", A:"left",
            ArrowRight:"right", d:"right", D:"right",
            " ":"stop"
        };
        var keysDown = {};
        document.addEventListener("keydown", function(e) {
            var action = keyMap[e.key];
            if (action && !keysDown[e.key]) {
                keysDown[e.key] = true;
                sendControl(action);
            }
        });
        document.addEventListener("keyup", function(e) {
            if (keyMap[e.key]) {
                delete keysDown[e.key];
                if (Object.keys(keysDown).length === 0) sendControl("stop");
            }
        });
    </script>
</body>
</html>
